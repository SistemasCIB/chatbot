<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CIB — Exportar CSV</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --navy:#223A7F;
    --navy-deep:#182B63;
    --border:#E4EAF2;
    --text:#1E293B;
    --muted:#6B7280;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    font-family:'Outfit',sans-serif;
    background:#F7F9FC;
    display:flex;
    justify-content:center;
    align-items:center;
}


.card{
    background:white;
    width:450px;
    padding:35px;
    border-radius:14px;
    border:1px solid var(--border);
    box-shadow:0 8px 24px rgba(34,58,127,.12);
}


.top-actions{
    margin-bottom:25px;
}


.btn-back{
    display:inline-block;
    text-decoration:none;
    color:var(--navy);
    background:#E9EEFA;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
}


h2{
    color:var(--navy);
    margin-bottom:10px;
}


p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}


label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}


input{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:18px;
    font-family:'Outfit';
}


button{
    width:100%;
    padding:12px;
    background:var(--navy);
    color:white;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}


button:hover{
    background:var(--navy-deep);
}


.todo{
    margin-top:15px;
    font-size:12px;
    color:#6B7280;
}

</style>

</head>


<body>


<div class="card">


    <div class="top-actions">

        <a href="/asesor" class="btn-back">
            ← Volver al panel
        </a>

    </div>



    <h2>
        ⬇ Exportar citas CSV
    </h2>


    <p>
        Selecciona un rango de fechas.  
        Si dejas los campos vacíos descargarás todas las citas.
    </p>



    <form action="/asesor/exportar" method="GET">


        <label>
            Fecha inicial
        </label>

        <input 
            type="date"
            name="fecha_inicio"
        >



        <label>
            Fecha final
        </label>

        <input 
            type="date"
            name="fecha_fin"
        >



        <button type="submit">
            Descargar CSV
        </button>


    </form>


</div>


</body>
</html>
